# Render Blueprint Specification for DeceptiTrace
# Documentation: https://render.com/docs/blueprint-spec

services:
  # =========================================================================
  # 1. Backend Web Service (FastAPI)
  # =========================================================================
  - type: web
    name: deceptitrace-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "http://localhost:5173"
      - key: ADAPTION_API_KEY
        sync: false
      - key: ADAPTION_PROJECT_ID
        sync: false

  # =========================================================================
  # 2. Frontend Static Site (React + Vite)
  # =========================================================================
  - type: web
    name: deceptitrace-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
